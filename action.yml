name: Mirror Subtree
description: >-
  Force-push a subdirectory (subtree) of the current repo to a mirror
  repository using an SSH deploy key. Extracts the subtree with
  `git subtree split` (re-rooted history) and pushes it. Self-contained:
  checks out full history, loads the key, splits, and pushes.

inputs:
  target-repo:
    description: "SSH URL of the mirror repo, e.g. git@github.com:owner/repo.git"
    required: true
  prefix:
    description: "Subdirectory to mirror, relative to repo root (e.g. apps/web). No trailing slash needed."
    required: true
  ssh-private-key:
    description: >-
      SSH private key whose public half is added as a write deploy key on the
      mirror repo. Pass the repo's existing SSH secret from the caller workflow.
    required: true
  sync-branches:
    description: >-
      Space-separated source branches or source:target mappings to mirror (e.g.
      'main staging' or 'dev:main staging:preview').
    required: false
    default: main
  git-user-name:
    description: >-
      Git committer name for an empty sync commit appended after the split.
      Leave both this and git-user-email empty to push the split as-is.
    required: false
  git-user-email:
    description: >-
      Git committer email for the empty sync commit. Leave both this and
      git-user-name empty to push the split as-is.
    required: false

runs:
  using: composite
  steps:
    - name: Checkout (full history)
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Load mirror deploy key
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    - name: Trust GitHub SSH host
      shell: bash
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan github.com >> ~/.ssh/known_hosts

    - name: Verify git subtree is available
      shell: bash
      run: |
        subtree="$(git --exec-path)/git-subtree"
        if [ ! -x "$subtree" ]; then
          echo "git-subtree is required but not found at $subtree"
          exit 1
        fi

    - name: Verify source objects
      shell: bash
      run: git fsck --no-dangling

    - name: Configure git identity
      if: inputs.git-user-name != '' && inputs.git-user-email != ''
      shell: bash
      env:
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        git config user.name "$GIT_USER_NAME"
        git config user.email "$GIT_USER_EMAIL"

    - name: Add mirror remote
      shell: bash
      env:
        TARGET_REPO: ${{ inputs.target-repo }}
      run: git remote add mirror "$TARGET_REPO"

    - name: Validate inputs
      shell: bash
      env:
        SYNC_BRANCHES: ${{ inputs.sync-branches }}
        PREFIX: ${{ inputs.prefix }}
      run: |
        set -euo pipefail
        if [ -z "${PREFIX// /}" ]; then
          echo "prefix is required"; exit 1
        fi
        for spec in $SYNC_BRANCHES; do
          case "$spec" in
            *:*:*) echo "invalid sync-branches entry '$spec': expected source or source:target"; exit 1 ;;
            *:*) source="${spec%%:*}"; target="${spec#*:}" ;;
            *) source="$spec"; target="$spec" ;;
          esac
          if [ -z "$source" ] || [ -z "$target" ]; then
            echo "invalid sync-branches entry '$spec': source and target are required"; exit 1
          fi
          git check-ref-format --branch "$source" >/dev/null
          git check-ref-format --branch "$target" >/dev/null
          echo "ok: $source -> $target"
        done

    - name: Split and push subtree
      shell: bash
      env:
        SYNC_BRANCHES: ${{ inputs.sync-branches }}
        PREFIX: ${{ inputs.prefix }}
        DO_COMMIT: ${{ inputs.git-user-name != '' && inputs.git-user-email != '' }}
      run: |
        set -euo pipefail
        for spec in $SYNC_BRANCHES; do
          case "$spec" in
            *:*) source="${spec%%:*}"; target="${spec#*:}" ;;
            *) source="$spec"; target="$spec" ;;
          esac
          echo "Checking out $source from origin"
          git checkout -B "$source" "refs/remotes/origin/$source"
          echo "Splitting subtree '$PREFIX' from $source"
          split_sha="$(git subtree split --prefix="$PREFIX" "$source" | tail -n1)"
          if [ -z "$split_sha" ]; then
            echo "subtree split produced no commit for prefix '$PREFIX' on $source"; exit 1
          fi
          echo "  split -> $split_sha"
          git checkout -B __subtree_push "$split_sha"
          if [ "$DO_COMMIT" = "true" ]; then
            git commit --allow-empty -m "chore: sync"
          fi
          echo "Pushing subtree $source -> mirror/$target"
          git push mirror "refs/heads/__subtree_push:refs/heads/$target" --force --no-thin
        done
